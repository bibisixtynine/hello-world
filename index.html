<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Une simple page Hello World." />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #f8fafc;
        background:
          radial-gradient(circle at 20% 20%, #7c3aed 0, transparent 35%),
          radial-gradient(circle at 80% 80%, #0891b2 0, transparent 35%),
          #0f172a;
      }

      main {
        width: min(90%, 42rem);
        padding: 4rem 2rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 2rem;
        background: rgba(15, 23, 42, 0.55);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 7rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      p {
        margin: 1.5rem 0 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2vw, 1.25rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World!</h1>
      <p>Bienvenue sur mon premier site en ligne.</p>
    </main>
  </body>
</html>
